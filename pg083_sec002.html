    <h1 class="source-line lesson-ribbon" data-id="pg083_s002_n0001">Somo la kwanza</h1><p class="source-line source-heading" data-id="pg083_s002_n0002">Herufi zinazoungwa upande wa kushoto tu</p><p class="source-line source-heading" data-id="pg083_s002_n0003">Katika somo hili utajifunza kuandika herufi</p><p class="source-line source-heading" data-id="pg083_s002_n0004">zinazoungwa upande wa ku shoto tu. Herufi hizo ni</p><p class="source-line source-heading" data-id="pg083_s002_n0005">b, g, j, o, p na y .</p><p class="source-line source-heading" data-id="pg083_s002_n0006">Nakili herufi hizi katika daftari lako.</p><div class="response-card handwriting-response" data-response-id="pg083_sec002_response_01"><p class="inclusive-instruction" id="pg083_sec002_response_01_label" data-id="pg083_sec002_response_01_label">Andika jibu kwa mkono, au tumia kibodi au Breli katika sehemu hii.</p><div class="canvas-wrap"><canvas class="drawing-canvas" width="900" height="220" aria-labelledby="pg083_sec002_response_01_label"></canvas></div><label class="keyboard-label" for="pg083_sec002_response_01_text">Tumia kibodi au Breli</label><input id="pg083_sec002_response_01_text" class="keyboard-response" type="text" aria-labelledby="pg083_sec002_response_01_label"><button type="button" class="clear-response">Futa jibu</button></div><p class="source-line source-heading" data-id="pg083_s002_n0007">na</p><p class="source-line source-heading" data-id="pg083_s002_n0008">Mfano</p><div class="printed-page-number" aria-hidden="true">77</div>
